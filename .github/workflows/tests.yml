name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Parse the fictional demonstration
        run: python scripts/parse_export.py examples/robot-garden output/demo --chat-name 'Robot Garden' --copy-source
